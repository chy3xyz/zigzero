name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (${{ matrix.os }}, sqlite)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq mariadb-connector-c sqlite3

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  codegen-smoke:
    name: zgctl smoke (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Build
        run: zig build

      - name: zgctl api (DSL spec)
        run: zig-out/bin/zgctl api examples/user.api -o /tmp/ctl-smoke/api

      - name: zgctl openapi + validate JSON
        run: |
          zig-out/bin/zgctl openapi examples/user.api -o /tmp/ctl-smoke/docs
          python3 -m json.tool /tmp/ctl-smoke/docs/openapi.json > /dev/null

      - name: zgctl model
        run: |
          printf 'CREATE TABLE users (\n  id SERIAL PRIMARY KEY,\n  name VARCHAR(255) NOT NULL,\n  email TEXT\n);\n' > /tmp/ctl-smoke/schema.sql
          zig-out/bin/zgctl model /tmp/ctl-smoke/schema.sql -o /tmp/ctl-smoke/models

      - name: zgctl new + build template project
        run: |
          zig-out/bin/zgctl new smoke-app .tmp-smoke/smoke-app
          sed -i 's|\.url = ".*",|.path = "../..",|' .tmp-smoke/smoke-app/build.zig.zon
          cd .tmp-smoke/smoke-app && zig build

  test-db:
    name: DB tests (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zigzero
          POSTGRES_PASSWORD: zigzero
          POSTGRES_DB: zigzero_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U zigzero"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zigzero_test
          MYSQL_USER: zigzero
          MYSQL_PASSWORD: zigzero
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Setup PostgreSQL environment
        if: matrix.db == 'postgres'
        run: |
          echo "DB=postgres" >> $GITHUB_ENV
          echo "PGconninfo=host=localhost port=5432 dbname=zigzero_test user=zigzero password=zigzero" >> $GITHUB_ENV

      - name: Setup MySQL environment
        if: matrix.db == 'mysql'
        run: |
          echo "DB=mysql" >> $GITHUB_ENV
          echo "MYSQL_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "MYSQL_PORT=3306" >> $GITHUB_ENV
          echo "MYSQL_USER=zigzero" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=zigzero" >> $GITHUB_ENV
          echo "MYSQL_DATABASE=zigzero_test" >> $GITHUB_ENV

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
